name: Build and Package TrafficSimulator

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            archive: traffic-simulator-linux.zip
          - os: macos-latest
            platform: macos
            archive: traffic-simulator-macos.zip
          - os: windows-latest
            platform: windows
            archive: traffic-simulator-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Make mvnw executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test --batch-mode --no-transfer-progress
        shell: bash

      - name: Package (UAT profile)
        run: ./mvnw package -Puat --batch-mode --no-transfer-progress -DskipTests
        shell: bash

      - name: Stage dist directory (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/lib
          cp target/TrafficSimulator-*.jar dist/
          cp target/lib/*.jar dist/lib/ 2>/dev/null || true
          cat > dist/run.sh << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          java --module-path "$DIR/lib" --add-modules javafx.controls,javafx.fxml \
               -jar "$DIR/$(ls "$DIR"/*.jar | head -1 | xargs basename)"
          EOF
          chmod +x dist/run.sh

      - name: Stage dist directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/lib | Out-Null
          Copy-Item target/TrafficSimulator-*.jar dist/
          if (Test-Path target/lib) { Copy-Item target/lib/*.jar dist/lib/ }
          $bat = @'
          @echo off
          set DIR=%~dp0
          for %%f in ("%DIR%*.jar") do set JAR=%%f
          java --module-path "%DIR%lib" --add-modules javafx.controls,javafx.fxml -jar "%JAR%"
          '@
          $bat | Set-Content dist\run.bat

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: zip -r ${{ matrix.archive }} dist/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
